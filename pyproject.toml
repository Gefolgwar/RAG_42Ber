[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RAG_42Ber"
version = "0.1.0"
description = "RAG implementation with BM25, Qwen, and FastAPI"
readme = "README.md"
requires-python = ">=3.10"

# Qwen/Qwen3-0.6B — обов'язковий за V.4/VI.3; CPU-only код (жодних
# викликів CUDA в src/) + CPU-only wheel torch з pytorch-cpu індексу
# (без nvidia/cuda/triton). accelerate/pystemmer прибрані: 0 імпортів.
# Бонуси 1-2 (dense/hybrid) потребують sentence-transformers (залишено
# в default, бо moulinette запускає лише `uv sync` без --extra).
dependencies = [
    "pydantic>=2.6.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "bm25s>=0.2.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# Залежності для розробки, перевірки типізації та тестування (Chapter V.1)
[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "types-tqdm>=4.70.0.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.mypy.overrides]]
module = [
    "bm25s",
    "bm25s.*",
    "fire",
    "fire.*",
]
ignore_missing_imports = true